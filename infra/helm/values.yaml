# Scaffold values for the NomadRules Helm chart.
api:
  replicas: 1
  image:
    repository: ghcr.io/ryanande/nomadrules-api
    tag: latest

migrations:
  image:
    repository: ghcr.io/ryanande/nomadrules-dbmigrations
    tag: latest

emailDelivery:
  # Daily at 09:00 UTC; the worker only sends the digest on its configured DigestDayOfWeek (Friday).
  schedule: "0 9 * * *"
  image:
    repository: ghcr.io/ryanande/nomadrules-email-delivery
    tag: latest

ingest:
  # Continuous consumer draining the crawler's Service Bus queue into law_changes.
  replicas: 1
  serviceBusQueue: "law-changes"
  image:
    repository: ghcr.io/ryanande/nomadrules-ingest
    tag: latest

observability:
  # Pushgateway endpoint for ephemeral batch-job metrics (migration runner).
  pushgatewayUrl: "http://prometheus-pushgateway.nomadrules-data:9091"
  # OTLP collector for traces -> Jaeger.
  otlpEndpoint: "http://otel-collector.nomadrules-data:4317"
