# Scaffold values for the NomadRules Helm chart.

# Key Vault reached via each service's own Workload Identity (see workload-identity.yaml)
# — never a plaintext secret in this file.
azure:
  keyVaultName: ""
  tenantId: "" # workforce Entra tenant the Key Vault RBAC is scoped to

# One Managed Identity + SecretProviderClass per service (see infra/terraform/workload-identity.tf
# for the matching Terraform side — keep the two `secrets` lists in sync by hand). `clientId` is a
# Terraform output, populated via --set or a per-env values file, never committed as a real value.
workloadIdentity:
  services:
    api:
      clientId: ""
      secrets: [postgres-connection-string, stripe-webhook-secret]
    ingest:
      clientId: ""
      secrets: [postgres-connection-string, servicebus-connection-string]
    summarizer:
      clientId: ""
      secrets: [postgres-connection-string, claude-api-key]
    email-delivery:
      clientId: ""
      secrets: [postgres-connection-string, resend-api-key]
    db-migrations:
      clientId: ""
      secrets: [postgres-connection-string]
    crawler:
      clientId: ""
      secrets: [servicebus-connection-string, storage-connection-string]

api:
  replicas: 1
  image:
    repository: ghcr.io/ryanande/nomadrules-api
    tag: latest
  # Non-secret: Entra External ID (CIAM) tenant identifiers, output by
  # infra/terraform (see entra.tf). Token validation only, no client secret.
  entra:
    authority: ""
    clientId: ""
    tenantId: ""

migrations:
  image:
    repository: ghcr.io/ryanande/nomadrules-dbmigrations
    tag: latest

emailDelivery:
  # Daily at 09:00 UTC; the worker only sends the digest on its configured DigestDayOfWeek (Friday).
  schedule: "0 9 * * *"
  image:
    repository: ghcr.io/ryanande/nomadrules-email-delivery
    tag: latest

ingest:
  # Continuous consumer draining the crawler's Service Bus queue into law_changes.
  replicas: 1
  serviceBusQueue: "law-changes"
  image:
    repository: ghcr.io/ryanande/nomadrules-ingest
    tag: latest

crawler:
  # Daily crawl pass (--run-now, one-shot) — matches the crawler's own scheduling model.
  schedule: "0 6 * * *"
  image:
    repository: ghcr.io/ryanande/nomadrules-crawler
    tag: latest

summarizer:
  replicas: 1
  image:
    repository: ghcr.io/ryanande/nomadrules-summarizer
    tag: latest

portal:
  replicas: 1
  image:
    repository: ghcr.io/ryanande/nomadrules-portal
    tag: latest
  # Non-secret: same CIAM tenant the API validates tokens against.
  entra:
    clientId: ""
    authority: ""
    apiScope: ""
  apiUrl: "https://api.nomadrules.com"

observability:
  # Pushgateway endpoint for ephemeral batch-job metrics (migration runner).
  pushgatewayUrl: "http://prometheus-pushgateway.nomadrules-data:9091"
  # OTLP collector for traces -> Jaeger.
  otlpEndpoint: "http://otel-collector.nomadrules-data:4317"
