# Daily email-delivery pass. Idempotency lives in the DB (renewal_alerts + notifications UNIQUE
# constraints), so a retried CronJob is safe — it runs one `--run-now` pass and exits.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-email-delivery
  namespace: nomadrules-services
spec:
  schedule: {{ .Values.emailDelivery.schedule | quote }}
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: email-delivery
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
          containers:
            - name: email-delivery
              image: "{{ .Values.emailDelivery.image.repository }}:{{ .Values.emailDelivery.image.tag }}"
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              resources:
                {{- toYaml .Values.emailDelivery.resources | nindent 16 }}
              args: ["--run-now"]
              env:
                - name: ConnectionStrings__Postgres
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-email-delivery-secrets
                      key: postgres-connection-string
                - name: RESEND_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Release.Name }}-email-delivery-secrets
                      key: resend-api-key
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: {{ .Values.observability.otlpEndpoint | quote }}
              volumeMounts:
                - name: secrets-store
                  mountPath: /mnt/secrets-store
                  readOnly: true
          volumes:
            - name: secrets-store
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: {{ .Release.Name }}-email-delivery-spc
