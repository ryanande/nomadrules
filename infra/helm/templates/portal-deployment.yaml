# Static SPA served by nginx (see src/portal/Dockerfile) — no secrets, no Key Vault/
# Workload Identity wiring needed (Entra client ID/authority are public SPA config,
# not credentials). Ingress/TLS for external access is not part of this change —
# see openspec/changes/aks-secure-platform-deployment for scope; this Service is
# ClusterIP only until an Ingress is added.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-portal
  namespace: nomadrules-services
spec:
  replicas: {{ .Values.portal.replicas | default 1 }}
  selector:
    matchLabels:
      app: nomadrules-portal
  template:
    metadata:
      labels:
        app: nomadrules-portal
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: portal
          image: "{{ .Values.portal.image.repository }}:{{ .Values.portal.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.portal.resources | nindent 12 }}
          ports:
            # 8080, not 80: the unprivileged nginx image (see src/portal/Dockerfile)
            # can't bind a port below 1024 as a non-root user.
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-portal
  namespace: nomadrules-services
spec:
  selector:
    app: nomadrules-portal
  ports:
    - port: 80
      targetPort: 8080
