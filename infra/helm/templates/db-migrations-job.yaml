# Runs once per release, before any other workload rolls out — Helm pre-upgrade/
# pre-install hook, not a per-pod init container (see api-deployment.yaml comment
# and design.md's Helm decision). `hook-delete-policy` clears the previous run's
# Job so a re-deploy doesn't collide with an old completed/failed Job of the same name.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-db-migrations
  namespace: nomadrules-services
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: db-migrations
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: db-migrations
          image: "{{ .Values.migrations.image.repository }}:{{ .Values.migrations.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.migrations.resources | nindent 12 }}
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-db-migrations-secrets
                  key: postgres-connection-string
            - name: PUSHGATEWAY_URL
              value: {{ .Values.observability.pushgatewayUrl | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-db-migrations-spc
