# Ingest consumer: drains the crawler's Service Bus queue into law_changes. Runs continuously (a receiver),
# so it's a Deployment, not a CronJob. Idempotency lives in the DB (UNIQUE source_message_id + ON CONFLICT
# DO NOTHING), so at-least-once delivery and pod restarts never create duplicate rows.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-ingest
  namespace: nomadrules-services
spec:
  replicas: {{ .Values.ingest.replicas | default 1 }}
  selector:
    matchLabels:
      app: nomadrules-ingest
  template:
    metadata:
      labels:
        app: nomadrules-ingest
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ingest
      securityContext:
        runAsNonRoot: true
      containers:
        - name: ingest
          image: "{{ .Values.ingest.image.repository }}:{{ .Values.ingest.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-ingest-secrets
                  key: postgres-connection-string
            - name: Ingest__Transport
              value: "servicebus"
            - name: Ingest__ServiceBusQueue
              value: {{ .Values.ingest.serviceBusQueue | quote }}
            - name: AZURE_SERVICE_BUS_CONNECTION_STRING
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-ingest-secrets
                  key: servicebus-connection-string
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-ingest-spc
