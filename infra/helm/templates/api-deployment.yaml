# Schema is applied by the db-migrations pre-upgrade Helm hook Job (see
# db-migrations-job.yaml), which runs to completion before this Deployment rolls
# out on every `helm upgrade` — not a per-pod-start init container anymore, since
# migrations only need to run once per release, not once per replica/restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  namespace: nomadrules-services
spec:
  replicas: {{ .Values.api.replicas | default 1 }}
  selector:
    matchLabels:
      app: nomadrules-api
  template:
    metadata:
      labels:
        app: nomadrules-api
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: api
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          ports:
            - containerPort: 8080
          env:
            - name: ConnectionStrings__Postgres
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-secrets
                  key: postgres-connection-string
            - name: Stripe__WebhookSecret
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-api-secrets
                  key: stripe-webhook-secret
            - name: Entra__Authority
              value: {{ .Values.api.entra.authority | quote }}
            - name: Entra__ClientId
              value: {{ .Values.api.entra.clientId | quote }}
            - name: Entra__TenantId
              value: {{ .Values.api.entra.tenantId | quote }}
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Release.Name }}-api-spc
