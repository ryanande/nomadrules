# Local dev parity with the production Postgres Flexible Server (see
# openspec/changes/aks-secure-platform-deployment). Each service's appsettings.json
# points at `nomadrules_dev` here; run db-migrations against this before starting
# api/ingest/summarizer/email-service locally.
services:
  postgres:
    image: postgres:16
    container_name: nomadrules-postgres
    environment:
      POSTGRES_USER: nomadrules
      POSTGRES_PASSWORD: nomadrules
      POSTGRES_DB: nomadrules_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
