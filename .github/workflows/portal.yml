# Build, scan, and deploy the portal image.
name: portal-image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/portal/**"
      - ".github/workflows/portal.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nomadrules-portal

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/portal
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          trivyignores: .trivyignore

      - name: Push image
        run: docker push -a ${{ env.IMAGE }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/aks-set-context@v4
        with:
          resource-group: ${{ secrets.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ secrets.AKS_CLUSTER_NAME }}

      - uses: azure/setup-helm@v4

      - run: |
          # Image workflows deploy in parallel and Helm serializes per release: retry only on
          # its release-lock error; any other failure (e.g. a failed migration) fails immediately.
          set -o pipefail
          for attempt in $(seq 1 20); do
            if helm upgrade --install nomadrules infra/helm \
              --namespace nomadrules-services --create-namespace \
              --reuse-values \
              -f infra/helm/values-azure.yaml \
              --set portal.image.tag=${{ github.sha }} 2>&1 | tee helm.log; then
              exit 0
            fi
            grep -q "another operation (install/upgrade/rollback) is in progress" helm.log || exit 1
            echo "release locked (attempt $attempt); retrying"
            sleep $((30 + RANDOM % 30))
          done
          exit 1
