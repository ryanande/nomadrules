# Scaffold: build + push the ingest worker image, tagged with the commit SHA.
name: ingest-image

on:
  push:
    branches: [main]
    paths:
      - "src/ingest/**"
      - ".github/workflows/ingest.yml"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nomadrules-ingest

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src/ingest/NomadRules.Ingest
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
