# Scaffold: plan-only check on PRs touching infra/terraform. Auth is OIDC federated
# credential (see infra/terraform/README.md) — no stored Azure client secret.
name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_key_vault_name: ${{ vars.KEY_VAULT_NAME }}
      TF_VAR_aks_cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_ciam_tenant_id: ${{ vars.TF_VAR_CIAM_TENANT_ID }}
      TF_VAR_ciam_client_id: ${{ secrets.AZURE_CIAM_CLIENT_ID }}
      TF_VAR_ciam_tenant_domain: ${{ vars.CIAM_TENANT_DOMAIN }}
      TF_VAR_team_role_assignments: ${{ vars.TEAM_ROLE_ASSIGNMENTS }}
      TF_VAR_break_glass_object_id: ${{ vars.BREAK_GLASS_OBJECT_ID }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      # The vault firewall admits only this runner's IP (see resources.tf).
      - name: Allow runner IP through Key Vault firewall
        run: |
          IP="$(curl -fsS https://api.ipify.org)"
          echo "TF_VAR_key_vault_allowed_ips=[\"$IP\"]" >> "$GITHUB_ENV"
          # Terraform refreshes existing secrets before it can update the vault ACL,
          # so admit this runner first (no-op on the very first run, before the vault exists).
          if az keyvault show --name "$TF_VAR_key_vault_name" --resource-group "$TF_VAR_resource_group_name" >/dev/null 2>&1; then
            az keyvault network-rule add --name "$TF_VAR_key_vault_name" --resource-group "$TF_VAR_resource_group_name" --ip-address "$IP" >/dev/null
            sleep 30
          fi

      # backend.ci.hcl is gitignored (state-backend location isn't secret, but
      # isn't committed either — see README.md); materialize it from repo
      # Variables (Settings > Variables, not Secrets) instead.
      - name: Write backend config
        run: |
          cat > backend.ci.hcl <<EOF
          resource_group_name  = "${{ vars.TF_BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "tfstate"
          use_azuread_auth     = true
          key                  = "nomadrules.tfstate"
          EOF

      - run: terraform init -backend-config=backend.ci.hcl
      - run: terraform plan -input=false
