# Scaffold: apply on merge to main. Auth is OIDC federated credential (see
# infra/terraform/README.md) — no stored Azure client secret. The `environment:`
# below must have required reviewers configured in repo Settings > Environments
# (this is a one-time manual step — GitHub Environment protection rules aren't
# expressible in workflow YAML) so every apply gets a human checkpoint after merge.
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: terraform-apply
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_key_vault_name: ${{ vars.KEY_VAULT_NAME }}
      TF_VAR_aks_cluster_name: ${{ vars.AKS_CLUSTER_NAME }}
      TF_VAR_acr_name: ${{ vars.ACR_NAME }}
      TF_VAR_ciam_tenant_id: ${{ vars.TF_VAR_CIAM_TENANT_ID }}
      TF_VAR_ciam_tenant_domain: ${{ vars.CIAM_TENANT_DOMAIN }}
      TF_VAR_team_role_assignments: ${{ vars.TEAM_ROLE_ASSIGNMENTS }}
      TF_VAR_break_glass_object_id: ${{ vars.BREAK_GLASS_OBJECT_ID }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      # backend.ci.hcl is gitignored (state-backend location isn't secret, but
      # isn't committed either — see README.md); materialize it from repo
      # Variables (Settings > Variables, not Secrets) instead.
      - name: Write backend config
        run: |
          cat > backend.ci.hcl <<EOF
          resource_group_name  = "${{ vars.TF_BACKEND_RESOURCE_GROUP }}"
          storage_account_name = "${{ vars.TF_BACKEND_STORAGE_ACCOUNT }}"
          container_name       = "tfstate"
          use_azuread_auth     = true
          key                  = "nomadrules.tfstate"
          EOF

      - run: terraform init -backend-config=backend.ci.hcl
      - run: terraform apply -input=false -auto-approve
