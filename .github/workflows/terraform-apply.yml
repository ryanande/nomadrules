# Scaffold: apply on merge to main. Auth is OIDC federated credential (see
# infra/terraform/README.md) — no stored Azure client secret. The `environment:`
# below must have required reviewers configured in repo Settings > Environments
# (this is a one-time manual step — GitHub Environment protection rules aren't
# expressible in workflow YAML) so every apply gets a human checkpoint after merge.
name: terraform-apply

on:
  push:
    branches: [main]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: terraform-apply
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init -backend-config=backend.ci.hcl
      - run: terraform apply -input=false -auto-approve
